name: Deploy Health Systems Site

on:
  push:
    paths:
      - '.bootstrap2/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and expand site archive
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(tr -d '\r\n ' < .bootstrap2/READY)"
          ACTUAL="$(sha256sum .bootstrap2/site.zip | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          rm -rf /tmp/healthsite-unpack
          mkdir -p /tmp/healthsite-unpack
          unzip -q .bootstrap2/site.zip -d /tmp/healthsite-unpack
          rsync -a --delete --exclude '.git/' --exclude '.github/' /tmp/healthsite-unpack/sierra-leone-health-systems-site/ ./
          rm -rf .bootstrap2

      - name: Commit expanded site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy Sierra Leone Health Systems site update"
            git push
          fi
